<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLIX Magazine — Explore. Create. Evolve.</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo-text">HOLIX MAGAZINE</a>
        <nav class="site-nav">
            <a href="#issues">Issues</a>
            <a href="#feature-fridays">Feature Fridays</a>
        </nav>
    </header>

    <main class="container" style="padding: 40px 5%;">
        <section class="hero" style="text-align: center; margin-bottom: 60px;">
            <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 12px;">Explore. Create. Evolve.</h1>
            <p style="color: var(--text-muted); font-size: 1.1rem;">A curated digital art & creativity publication.</p>
        </section>

        <section id="issues" class="content-section" style="margin-bottom: 60px;">
            <h2>Published Issues</h2>
            <div id="issues-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 20px;">
                <!-- Dynamically loaded issues grid -->
            </div>
        </section>

        <section id="feature-fridays" class="content-section">
            <h2>Feature Fridays</h2>
            <div id="ff-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 20px;">
                <!-- Dynamically loaded Feature Fridays grid -->
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/common.js"></script>
    <script type="module" src="/js/home.js"></script>
</body>
</html>
