<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLIX — Digital Magazine</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo-text">HOLIX</a>
        <nav class="site-nav">
            <a href="#issues">Issues</a>
            <a href="#feature-fridays">Feature Fridays</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Explore. Create. Evolve.</h1>
            <p>A curated digital art & creativity publication.</p>
        </section>

        <section id="issues" class="content-section">
            <h2>Published Issues</h2>
            <div id="issues-grid" class="grid">
                <!-- Dynamically loaded issues -->
            </div>
        </section>

        <section id="feature-fridays" class="content-section">
            <h2>Feature Fridays</h2>
            <div id="ff-grid" class="grid">
                <!-- Dynamically loaded Feature Fridays -->
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/common.js"></script>
    <script type="module" src="/js/home.js"></script>
</body>
</html>
