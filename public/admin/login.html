<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | AUTOVANT editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-page">
  <main class="login">
    <a class="wordmark" href="/">Autovant</a>
    <h1>Editor sign in</h1>
    <p class="login-note">This area is for the AUTOVANT editor only.</p>
    <form id="login-form">
  <div class="field">
    <label for="email">EMAIL</label>
    <input type="email" id="email" name="email" required placeholder="admin@autovant.com" autocomplete="email">
  </div>

  <div class="field">
    <label for="password">PASSWORD</label>
    <input type="password" id="password" name="password" required placeholder="••••••••">
  </div>

  <button type="submit">SIGN IN</button>
</form>

  </main>
  <script src="/admin/assets/login.js"></script>
  <script type="module" src="/admin/assets/login.js"></script>
</body>
</html>
