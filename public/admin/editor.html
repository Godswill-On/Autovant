<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor | HOLIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Hanken+Grotesk:wght@300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="admin">
  <header class="admin-top">
    <div class="wrap admin-top__in">
      <a class="wordmark" href="#/" aria-label="All features">Holix</a>
      <span class="admin-badge">Editor</span>
      <nav class="admin-nav" aria-label="Editor">
        <a href="/" target="_blank" rel="noopener">View site</a>
        <button type="button" id="subs-csv">Subscribers (CSV)</button>
        <button type="button" id="signout">Sign out</button>
      </nav>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main class="wrap admin-main" id="app">
    <p class="muted">Loading&hellip;</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="wrap">The editor needs JavaScript.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/data.js"></script>
  <script src="/admin/assets/editor.js"></script>
</body>
</html>
