<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14104f"/>
      <stop offset="1" stop-color="#07052a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.8">
    <ellipse cx="260" cy="210" rx="300" ry="190" fill="#7d328d" opacity="0.55"/>
    <ellipse cx="900" cy="520" rx="340" ry="200" fill="#e0006d" opacity="0.38"/>
    <ellipse cx="1000" cy="130" rx="220" ry="130" fill="#ef7b00" opacity="0.30"/>
  </g>
  <g filter="url(#rough)" fill="none" stroke-linecap="round">
    <path d="M-40 470 C 220 330, 420 560, 700 420 S 1100 300, 1260 400" stroke="#e0006d" stroke-width="70" opacity="0.8"/>
    <path d="M-40 560 C 260 470, 470 640, 760 520 S 1120 450, 1260 520" stroke="#eaa029" stroke-width="34" opacity="0.85"/>
    <path d="M120 140 C 330 60, 520 210, 760 130 S 1010 80, 1180 150" stroke="#fffff3" stroke-width="12" opacity="0.7"/>
    <path d="M60 250 C 300 190, 480 310, 720 240" stroke="#7d328d" stroke-width="46" opacity="0.9"/>
    <path d="M820 640 C 900 560, 1040 600, 1160 540" stroke="#ef7b00" stroke-width="22" opacity="0.9"/>
  </g>
  <g>
    <circle cx="930" cy="250" r="11" fill="#eaa029"/>
    <circle cx="975" cy="285" r="6" fill="#e0006d"/>
    <circle cx="880" cy="300" r="4" fill="#fffff3" opacity="0.8"/>
    <circle cx="300" cy="620" r="9" fill="#fffff3" opacity="0.6"/>
    <circle cx="350" cy="650" r="5" fill="#eaa029"/>
  </g>
</svg>
